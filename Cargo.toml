[package]
name = "tablo-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Filament demo, rebuilt on Tablo."

[dependencies]
tablo = { git = "https://github.com/y-l-g/tablo", rev = "d5b3ac1290d627b0ed2b6889607145e45f5ad3b8", features = ["sqlite"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toasty = { version = "0.11", features = ["jiff", "serde", "sqlite"] }
tokio = { version = "1", features = ["fs"] }
topcoat = { version = "0.11", features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime", "multipart", "mail", "mail-smtp"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.23"

[build-dependencies]
tablo-build = { git = "https://github.com/y-l-g/tablo", rev = "d5b3ac1290d627b0ed2b6889607145e45f5ad3b8" }
topcoat = { version = "0.11", features = ["icon-iconify"] }

# Tablo tracks Topcoat `main` until its next release, and a patch applies only from the workspace
# root, so the demo repeats Tablo's own. Drop both when Tablo pins a released Topcoat again.
[patch.crates-io]
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-asset = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-cookie = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-core = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-font = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-icon = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-l10n = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-mail = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-router = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-runtime = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-session = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-tailwind = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }
topcoat-view = { git = "https://github.com/tokio-rs/topcoat", rev = "01bd585394891052a4bd68213a36ac8f8e8687c9" }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
