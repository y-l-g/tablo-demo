[package]
name = "tablo-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Tablo demo."

[dependencies]
tablo = { git = "https://github.com/y-l-g/tablo.git", features = ["sqlite", "rust_decimal"] }
jiff = "0.2"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toasty = { version = "0.11", features = ["jiff", "serde", "sqlite"] }
tokio = { version = "1", features = ["fs"] }
topcoat = { version = "0.11", features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime", "multipart", "mail", "mail-smtp"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.23"

[build-dependencies]
tablo-build = { git = "https://github.com/y-l-g/tablo.git" }
topcoat = { version = "0.11", features = ["icon-iconify"] }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

# Topcoat's `main` at the commit Tablo's `master` builds against, ahead of its next release.
# Cargo reads `[patch]` only from the root manifest, so Tablo's own patch does not reach this
# build. Drop this section once Topcoat releases and Tablo's dependency moves on.
[patch.crates-io]
topcoat = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-asset = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-cookie = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-core = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-font = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-icon = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-l10n = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-mail = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-router = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-runtime = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-session = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-tailwind = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
topcoat-view = { git = "https://github.com/tokio-rs/topcoat", rev = "d84362b72bc1034a8342e00c1cdf1a36d68dd9cf" }
