[package]
name = "tablo-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Tablo demo."

[dependencies]
tablo = { git = "https://github.com/y-l-g/tablo.git", rev = "5c9e26f7995147f0f833aaf11b3315db610875d7", features = ["sqlite", "rust_decimal"] }
form_urlencoded = "1"
jiff = "0.2"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toasty = { version = "0.11", features = ["jiff", "serde", "sqlite"] }
tokio = { version = "1", features = ["fs"] }
topcoat = { version = "0.12", features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime", "multipart", "mail", "mail-smtp"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.23"

[build-dependencies]
tablo-build = { git = "https://github.com/y-l-g/tablo.git", rev = "5c9e26f7995147f0f833aaf11b3315db610875d7" }
topcoat = { version = "0.12", features = ["icon-iconify"] }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

