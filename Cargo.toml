[package]
name = "tablo-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Filament demo, rebuilt on Tablo."

[dependencies]
tablo = { version = "0.8.0", features = ["sqlite"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toasty = { version = "0.11", features = ["jiff", "serde", "sqlite"] }
tokio = { version = "1", features = ["fs"] }
topcoat = { version = "0.11", features = ["serve", "tailwind", "font", "font-fontsource", "asset", "runtime", "multipart", "mail", "mail-smtp"] }
uuid = "1.23"

[build-dependencies]
tablo-build = "0.8.0"
topcoat = { version = "0.11", features = ["icon-iconify"] }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
